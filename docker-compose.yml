# Defaults come from .env (see .env.example). COMPOSE_PROFILES=free starts Ollama in Docker.
services:
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_ANSWER_MODEL: ${GROQ_ANSWER_MODEL:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-}
      PROVIDER_STACK: ${PROVIDER_STACK:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      STT_PROVIDER: ${STT_PROVIDER:-browser}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gpt-live-transcribe}
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-6-luna}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      QUESTION_CONFIDENCE_THRESHOLD: ${QUESTION_CONFIDENCE_THRESHOLD:-0.80}
      MAX_ANSWER_WORDS: ${MAX_ANSWER_WORDS:-150}
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    ports: ["80:80"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["free"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["free"]
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    restart: "no"

volumes:
  ollama:
